name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing: 自动签名与 provenance，无令牌

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish
      - name: Sync npmmirror mirror
        continue-on-error: true
        run: |
          curl -fsS -X PUT "https://registry.npmmirror.com/-/package/opencode-tsgw/syncs" \
            -o /dev/null -w "npmmirror sync: HTTP %{http_code}\n"
